<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pico — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #1e1e2e; color: #cdd6f4; }
    main { width: min(320px, calc(100% - 48px)); padding: 26px; border: 1px solid #45455d; border-radius: 12px; background: #252536; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 22px; color: #a6adc8; font-size: 14px; }
    a { display: inline-block; padding: 10px 16px; background: #35354b; color: #cdd6f4; border: 1px solid #50516a; border-radius: 7px; text-decoration: none; font-size: 14px; }
    a:hover { background: #41415a; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Connect to the internet to use Pico.</p>
    <a href="https://picompiler.pages.dev/">Try again</a>
  </main>
</body>
</html>
