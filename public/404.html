<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0d10">
  <link rel="icon" type="image/svg+xml" href="/pico-logo.svg">
  <title>404 | Pico</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Archivo+Black&family=Syne:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Rubik+Mono+One&family=Unbounded:wght@500;700;900&family=Righteous&family=Chakra+Petch:wght@600;700&family=Outfit:wght@600;700;800&family=Press+Start+2P&display=swap');
    :root{color-scheme:dark;font-family:"DM Sans",system-ui,sans-serif;--bg:#1e1e2e;--surface:#181825;--text:#cdd6f4;--muted:#9ba0bb;--accent:#cba6f7;--border:#393b4d;--soft:#222438;--button-text:#080a10;--headline:"Space Grotesk",sans-serif;--numeral:"Archivo Black",sans-serif;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--bg);overflow-x:hidden}
    .shell{position:relative;isolation:isolate;min-height:100svh;padding:clamp(22px,4.6vw,64px);display:flex;flex-direction:column;overflow:hidden}
    .brand{display:inline-flex;align-items:center;gap:10px;width:max-content;font-size:19px;font-weight:800;letter-spacing:-.8px;color:var(--text);text-decoration:none;position:relative;z-index:5}
    .brand img{width:30px;height:30px}.brand-word{display:inline!important;white-space:nowrap}.brand .brand-dot{color:var(--accent)}
    .main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;min-width:0;width:100%;min-height:0;padding:clamp(32px,5vw,78px) 2vw}
    .content{width:min(100%,870px);min-width:0;max-width:100%;position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
    .status{flex:none;color:var(--accent);font:700 clamp(102px,16vw,210px)/1 var(--numeral);letter-spacing:-.07em;white-space:nowrap;max-width:100%;user-select:none;margin:0 0 clamp(22px,3vw,38px);max-width:100%}
    h1{font:800 clamp(27px,4vw,52px)/1.16 var(--headline);letter-spacing:-.045em;max-width:790px;overflow-wrap:anywhere;text-wrap:balance;margin:0 0 18px}
    .sub{font-size:clamp(15px,1.5vw,19px);color:var(--muted);line-height:1.6;max-width:630px;margin:0 0 30px;overflow-wrap:anywhere;text-wrap:pretty}
    .actions{display:flex;align-items:center;gap:18px}
    .back{appearance:none;background:var(--accent);color:var(--button-text);border:1px solid transparent;border-radius:7px;padding:13px 23px;font:700 14px "DM Sans",sans-serif;cursor:pointer;transition:transform .16s ease,filter .16s ease}
    .back:hover{transform:translateY(-2px);filter:brightness(1.08)}.back:focus-visible{outline:3px solid var(--text);outline-offset:3px}
    .scatter{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .bit{position:absolute;color:var(--accent);font-family:"Space Mono",monospace;white-space:nowrap;opacity:var(--opacity,.22);font-size:var(--size,20px);transform:rotate(var(--rotate,0deg));line-height:1.1;user-select:none}
    .bit:nth-child(3n){font-family:"Fredoka",sans-serif;font-weight:700}
    .bit:nth-child(4n){font-family:"Archivo Black",sans-serif}
    .bit:nth-child(5n){color:var(--text)}
    /* Every layout uses a single text column, never a collision-prone two-column grid. */
    .shell[data-layout="left"] .main,.shell[data-layout="stagger"] .main{justify-content:flex-start}
    .shell[data-layout="right"] .main,.shell[data-layout="reverse"] .main{justify-content:flex-end}
    .shell[data-layout="right"] .content{align-items:flex-end;text-align:right}
    .shell[data-layout="center"] .content{align-items:center;text-align:center}
    .shell[data-layout="up"] .main{align-items:flex-start}
    .shell[data-layout="down"] .main{align-items:flex-end}
    .shell[data-layout="tilt"] .content{transform:rotate(-1deg);transform-origin:center}
    .shell[data-layout="tilt-right"] .content{transform:rotate(1deg);transform-origin:center;align-items:flex-end;text-align:right}
    .shell[data-layout="stagger"] .status{align-self:flex-end;max-width:100%}
    .shell[data-layout="reverse"] .status{order:2;margin:10px 0 24px}
    .shell[data-layout="reverse"] h1{order:1}
    .shell[data-layout="reverse"] .sub{order:3}
    .shell[data-layout="reverse"] .actions{order:4}
    @media(max-width:720px){
      .shell{padding:26px 23px}
      .main{padding:45px 0;min-height:380px}
      .content{width:100%;align-items:flex-start!important;text-align:left!important;transform:none!important}
      .status{font-size:clamp(90px,21vw,145px);letter-spacing:-.06em;align-self:flex-start!important}
      h1{font-size:clamp(28px,7vw,42px)}
      .scatter{display:none}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}.content{transform:none!important}}
    .status{position:relative}
    .secret-toast{position:fixed;right:clamp(16px,4vw,45px);bottom:clamp(16px,4vw,45px);z-index:10;max-width:min(90vw,370px);border:1px solid var(--accent);border-radius:8px;background:var(--surface);color:var(--text);padding:15px 18px;font:600 13px/1.5 "Space Mono",monospace;box-shadow:0 12px 40px #0003;pointer-events:none}
    [hidden]{display:none!important}
    @media(max-width:720px){.reaction{font-size:12px;max-width:80vw}.status{margin-bottom:28px}.actions{flex-wrap:wrap;gap:10px}.secret-toast{left:16px;right:16px;max-width:none}}

    .shell[data-rare="tiny"] .status{font-size:clamp(42px,5vw,70px);letter-spacing:0}
    .shell[data-rare="inverted"] .status{transform:rotate(180deg)}
    .shell[data-rare="stamp"] .status{font-size:clamp(85px,12vw,160px);border:3px dashed var(--accent);padding:8px 20px;transform:rotate(-3deg)}
    .shell[data-rare="large"] .status{font-size:clamp(120px,18vw,235px)}
    @media(max-width:720px){.shell[data-rare="large"] .status{font-size:clamp(100px,22vw,156px)}.shell[data-rare="stamp"] .status{font-size:clamp(78px,18vw,118px);transform:none}}
    /* Aligned with the Pico app shell */
    .brand{padding-bottom:18px;width:100%;border-bottom:1px solid var(--border)}
    .back{border-radius:8px;padding:12px 20px;box-shadow:0 1px 2px #0003}
    .back:active{transform:scale(.97)}
    .status{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--bg)));-webkit-background-clip:text;background-clip:text;color:transparent}
    .shell[data-rare="stamp"] .status{color:var(--accent);background:none}
    .shell::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--text) 7%,transparent) 1px,transparent 0) 0 0/22px 22px}
    @media(prefers-reduced-motion:no-preference){.content>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}.content>:nth-child(2){animation-delay:.06s}.content>:nth-child(3){animation-delay:.12s}.content>:nth-child(n+4){animation-delay:.18s}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <main class="shell" id="error-shell">
    <div class="scatter" id="scatter" aria-hidden="true"></div>
    <a class="brand" href="/" aria-label="Pico home"><img src="/pico-logo.svg" alt=""><span class="brand-word">Pico<span class="brand-dot">.</span></span></a>
    <div class="main">
      <section class="content" aria-labelledby="joke-title">
        <div class="status" aria-hidden="true">404</div>
        <h1 id="joke-title">Well, that's awkward.</h1>
        <p class="sub" id="joke-description">There's nothing at this address.</p>
        <div class="actions"><button class="back" type="button" id="go-back">← Go back</button></div>
      </section>
    </div>
    <div class="secret-toast" id="secret-toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script>

    // Use the same saved preference keys and theme palette as Pico.
    const themes = {"high-contrast-red":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff9999"},"high-contrast-blue":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#82baff"},"high-contrast-yellow":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ffe45e"},"high-contrast-spectrum":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff99ff"},"high-contrast-sunset":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff9999"},"high-contrast-violet":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff99ff"},"high-contrast-ocean":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#00ffff"},"high-contrast-ink":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#660066"},"high-contrast-forest":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#005500"},"high-contrast-dark":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ffffff"},"high-contrast-light":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#000000"},"dark-plus":{"appearance":"dark","bg":"#1e1e1e","surface":"#252526","text":"#d4d4d4","muted":"#8a8a8a","accent":"#0e7ad3"},"light-plus":{"appearance":"light","bg":"#ffffff","surface":"#f3f3f3","text":"#1f1f1f","muted":"#646464","accent":"#0066b8"},"dracula":{"appearance":"dark","bg":"#282a36","surface":"#21222c","text":"#f8f8f2","muted":"#9298bd","accent":"#bd93f9"},"monokai":{"appearance":"dark","bg":"#272822","surface":"#2b2c26","text":"#f8f8f2","muted":"#a5a294","accent":"#a6e22e"},"one-dark":{"appearance":"dark","bg":"#282c34","surface":"#21252b","text":"#abb2bf","muted":"#89909e","accent":"#61afef"},"one-light":{"appearance":"light","bg":"#fafafa","surface":"#eaeaeb","text":"#383a42","muted":"#6f727d","accent":"#4078f2"},"nord":{"appearance":"dark","bg":"#2e3440","surface":"#3b4252","text":"#d8dee9","muted":"#98a3b8","accent":"#88c0d0"},"tokyo-night":{"appearance":"dark","bg":"#1a1b26","surface":"#16161e","text":"#c0caf5","muted":"#8b93bd","accent":"#7aa2f7"},"catppuccin-mocha":{"appearance":"dark","bg":"#1e1e2e","surface":"#181825","text":"#cdd6f4","muted":"#9ba0bb","accent":"#cba6f7"},"catppuccin-latte":{"appearance":"light","bg":"#eff1f5","surface":"#e6e9ef","text":"#4c4f69","muted":"#7b7f96","accent":"#8839ef"},"gruvbox-dark":{"appearance":"dark","bg":"#282828","surface":"#32302f","text":"#ebdbb2","muted":"#b3a894","accent":"#83a598"},"solarized-dark":{"appearance":"dark","bg":"#002b36","surface":"#073642","text":"#93a1a1","muted":"#8a9a9e","accent":"#268bd2"},"solarized-light":{"appearance":"light","bg":"#fdf6e3","surface":"#eee8d5","text":"#586e75","muted":"#5f747c","accent":"#1f7fb8"},"github-dark":{"appearance":"dark","bg":"#0d1117","surface":"#161b22","text":"#c9d1d9","muted":"#8b949e","accent":"#58a6ff"},"github-light":{"appearance":"light","bg":"#ffffff","surface":"#f6f8fa","text":"#1f2328","muted":"#59636e","accent":"#0969da"},"ayu-mirage":{"appearance":"dark","bg":"#1f2430","surface":"#242936","text":"#cbccc6","muted":"#8b94a7","accent":"#ffcc66"},"night-owl":{"appearance":"dark","bg":"#011627","surface":"#0b2942","text":"#d6deeb","muted":"#93a4b0","accent":"#82aaff"},"palenight":{"appearance":"dark","bg":"#292d3e","surface":"#333747","text":"#a6accd","muted":"#8f96b8","accent":"#82aaff"},"rose-pine":{"appearance":"dark","bg":"#191724","surface":"#1f1d2e","text":"#e0def4","muted":"#a8a3bd","accent":"#c4a7e7"},"synthwave-84":{"appearance":"dark","bg":"#262335","surface":"#2a2139","text":"#ffffff","muted":"#a9add6","accent":"#f92aad"},"cobalt2":{"appearance":"dark","bg":"#193549","surface":"#122738","text":"#ffffff","muted":"#a3bacb","accent":"#ffc600"},"everforest":{"appearance":"dark","bg":"#2d353b","surface":"#343f44","text":"#d3c6aa","muted":"#859289","accent":"#a7c080"},"kanagawa":{"appearance":"dark","bg":"#1f1f28","surface":"#16161d","text":"#dcd7ba","muted":"#727169","accent":"#7e9cd8"}};
    const legacy = {dark:'dark-plus',light:'light-plus',coffee:'gruvbox-dark',matcha:'gruvbox-dark',cappuccino:'one-dark',mocha:'rose-pine',raven:'tokyo-night'};
    let chosen = 'catppuccin-mocha';
    for (const key of ['pico.settings.v6','pico.settings.v5','pico.settings.v4','pico.settings.v3']) {
      try {
        const settings = JSON.parse(localStorage.getItem(key) || 'null');
        if (settings && typeof settings === 'object') {
          const requested = settings.theme;
          chosen = themes[requested] ? requested : (legacy[requested] || 'catppuccin-mocha');
          break;
        }
      } catch { /* Use Pico's default. */ }
    }
    const theme = themes[chosen] || themes['catppuccin-mocha'];
    const root = document.documentElement;
    const mix = (a,b,t) => {
      const channel = (hex,i) => parseInt(hex.slice(i,i+2),16);
      return '#' + [1,3,5].map(i => Math.round(channel(a,i)*(1-t)+channel(b,i)*t).toString(16).padStart(2,'0')).join('');
    };
    const highContrast = chosen.startsWith('high-contrast-');
    const border = highContrast ? theme.accent : mix(theme.surface, theme.text, theme.appearance === 'dark' ? .2 : .17);
    const soft = highContrast ? theme.surface : mix(theme.surface, theme.text, theme.appearance === 'dark' ? .06 : .04);
    for (const name of ['bg','surface','text','muted','accent']) root.style.setProperty('--'+name,theme[name]);
    root.style.setProperty('--border',border);
    root.style.setProperty('--soft',soft);
    root.style.setProperty('--button-text',theme.appearance === 'dark' ? '#080a10' : '#ffffff');
    root.style.colorScheme=theme.appearance;
    document.querySelector('meta[name="theme-color"]').setAttribute('content',theme.bg);
    const messages = [
      [
        "Pico checked this address.",
        "It returned OUTPUT \"Nope\"."
      ],
      [
        "Pico ran the URL.",
        "The result was an empty console and a very loud 404."
      ],
      [
        "Pico's debugger found the problem.",
        "This page never existed."
      ],
      [
        "Pico reached the end of the flowchart.",
        "Apparently it skipped the page entirely."
      ],
      [
        "Pico tried a logic gate.",
        "The answer to PAGE_EXISTS was FALSE."
      ],
      [
        "Pico's CPU fetched the URL.",
        "The instruction was: do absolutely nothing."
      ],
      [
        "Pico compiled your link.",
        "Zero syntax errors. Zero actual pages."
      ],
      [
        "Pico tried to print the page.",
        "OUTPUT \"404\" was all it had."
      ],
      [
        "Pico checked every register.",
        "No page. Just a lonely program counter."
      ],
      [
        "Pico made a flowchart for this route.",
        "Start → 404 → End. Efficient, at least."
      ],
      [
        "Pico set a breakpoint here.",
        "There was nothing to pause."
      ],
      [
        "Pico tested the URL twice.",
        "Both times, the page declined to exist."
      ],
      [
        "Pico ran a truth table.",
        "Every row says this page is missing."
      ],
      [
        "Pico opened the Python workspace.",
        "Even Python couldn't import this page."
      ],
      [
        "Pico converted the link to binary.",
        "It still adds up to 404."
      ],
      [
        "Pico tried a while loop.",
        "WHILE page_missing: keep wondering."
      ],
      [
        "Pico's flowchart found a dead end.",
        "At least the arrows are accurate."
      ],
      [
        "Pico asked the ALU for help.",
        "It calculated 404 with impressive confidence."
      ],
      [
        "Pico started a new project.",
        "This page was not included."
      ],
      [
        "Pico looked for the missing variable.",
        "PAGE_FOUND is still FALSE."
      ],
      [
        "Pico clicked Run.",
        "The only output was disappointment."
      ],
      [
        "Pico tried an AND gate.",
        "Page exists AND link works = FALSE."
      ],
      [
        "Pico tried an OR gate.",
        "Page exists OR page exists = still FALSE."
      ],
      [
        "Pico's CPU entered the fetch cycle.",
        "There was nothing at the address."
      ],
      [
        "Pico optimized this route.",
        "Maybe a little too much."
      ],
      [
        "Pico opened the console.",
        "It had one thing to say: 404."
      ],
      [
        "Pico tried to debug reality.",
        "This route failed the first test."
      ],
      [
        "Pico converted the page to pseudocode.",
        "IF EXISTS THEN ... oh."
      ],
      [
        "Pico checked the memory address.",
        "The page wasn't in RAM either."
      ],
      [
        "Pico simulated the circuit.",
        "The missing-page LED lit up immediately."
      ],
      [
        "Pico followed the flowchart.",
        "It took a scenic route to nowhere."
      ],
      [
        "Pico pressed Step Into.",
        "There was nothing to step into."
      ],
      [
        "Pico counted the available pages.",
        "This one wasn't among them."
      ],
      [
        "Pico's compiler needs input.",
        "Preferably a URL that exists."
      ],
      [
        "Pico attempted a binary search.",
        "The page was not in the sorted list."
      ],
      [
        "Pico checked the stack.",
        "The page isn't hiding there."
      ],
      [
        "Pico got an unexpected result.",
        "Actually, 404 was pretty expected."
      ],
      [
        "Pico wrote a Python exception.",
        "raise PageNotFoundError(\"404\")"
      ],
      [
        "Pico's logic simulator says LOW.",
        "So does this route's chance of existing."
      ],
      [
        "Pico tried a conditional branch.",
        "It jumped straight to 404."
      ],
      [
        "Pico loaded the wrong instruction.",
        "Apparently it was RETURN 404."
      ],
      [
        "Pico searched its workspace tabs.",
        "This page didn't make the cut."
      ],
      [
        "Pico checked for an infinite loop.",
        "Nope. Just a finite amount of page."
      ],
      [
        "Pico started with START.",
        "Then immediately reached NOT FOUND."
      ],
      [
        "Pico tried a NOT gate.",
        "NOT found is the only signal we're getting."
      ],
      [
        "Pico's CPU raised a flag.",
        "Unfortunately it says PAGE MISSING."
      ],
      [
        "Pico saved your progress.",
        "Just not this imaginary page."
      ],
      [
        "Pico checked the address bus.",
        "The destination has left the building."
      ],
      [
        "Pico is online and ready.",
        "This particular page, however, is not."
      ],
      [
        "Pico rendered a flowchart.",
        "The decision diamond says '404?' → Yes."
      ]
    ];
    // Avoid showing the same joke twice in a row, including on refresh.
    let previous = -1;
    try { previous = Number(sessionStorage.getItem('pico.404.lastJoke') ?? '-1'); } catch {}
    const candidates = messages.map((_,index) => index).filter(index => index !== previous);
    const random = new Uint32Array(1);
    crypto.getRandomValues(random);
    const index = candidates[random[0] % candidates.length];
    try { sessionStorage.setItem('pico.404.lastJoke', String(index)); } catch {}
    document.getElementById('joke-title').textContent = messages[index][0];
    document.getElementById('joke-description').textContent = messages[index][1];

    // Change the composition and type styles on each refresh.
    const layouts = ['left','center','right','up','down','tilt','tilt-right','stagger','reverse'];
    let previousLayout = '';
    try { previousLayout = sessionStorage.getItem('pico.404.lastLayout') || ''; } catch {}
    const otherLayouts = layouts.filter(layout => layout !== previousLayout);
    crypto.getRandomValues(random);
    const layout = otherLayouts[random[0] % otherLayouts.length];
    document.getElementById('error-shell').dataset.layout = layout;
    try { sessionStorage.setItem('pico.404.lastLayout', layout); } catch {}
    // A rare font treatment appears on roughly two percent of refreshes.
    crypto.getRandomValues(random);
    if (random[0] % 100 < 2) {
      const rare = ['tiny','inverted','stamp','large'];
      document.getElementById('error-shell').dataset.rare = rare[Math.floor(random[0] / 100) % rare.length];
    }


    const headlineFonts = [
      '"Fredoka",sans-serif','"Bricolage Grotesque",sans-serif','"Syne",sans-serif',
      '"Space Grotesk",sans-serif','"Archivo Black",sans-serif',
      '"Unbounded",sans-serif','"Righteous",sans-serif','"Outfit",sans-serif',
      '"Chakra Petch",sans-serif','"Rubik Mono One",monospace'
    ];
    const numeralFonts = [
      '"Archivo Black",sans-serif','"Space Mono",monospace','"Fredoka",sans-serif',
      '"Syne",sans-serif','"Unbounded",sans-serif','"Righteous",sans-serif',
      '"Rubik Mono One",monospace','"Chakra Petch",sans-serif','"Outfit",sans-serif',
      '"Press Start 2P",monospace'
    ];
    const pick = values => {
      const buffer = new Uint32Array(1);
      crypto.getRandomValues(buffer);
      return values[buffer[0] % values.length];
    };
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--headline',pick(headlineFonts));
    rootStyle.setProperty('--numeral',pick(numeralFonts));

    // Scatter tiny pieces of Pico around the edges, not on top of the joke.
    const glyphs = ['PICO','PYTHON','PSEUDOCODE','FLOWCHART','CPU STUDIO',
      'OUTPUT','DECLARE','ENDIF','WHILE','RETURN','FETCH','DECODE','EXECUTE',
      'ALU','PC','MAR','MDR','CIR','ACC','FLAG','404','0x404','NULL','FALSE',
      'IF PAGE_EXISTS','PAGE_NOT_FOUND','return 404','// route missing'];
    const scatter = document.getElementById('scatter');
    // Corners and side bands stay away from the central content area.
    const spots = [
      [4,18],[13,31],[7,72],[20,89],[33,12],[45,5],[64,8],[82,12],
      [94,27],[89,44],[94,68],[82,86],[66,95],[45,91],[31,82],
      [4,49],[16,8],[75,32],[91,91],[6,93]
    ];
    // Independent seed per refresh; vary which edge spots are used.
    const shuffled = [...spots].sort(() => Math.random() - .5);
    for (let i=0;i<16;i++){
      const item = document.createElement('span');
      item.className = 'bit';
      item.textContent = pick(glyphs);
      const [x,y] = shuffled[i];
      item.style.left = x + '%';
      item.style.top = y + '%';
      item.style.setProperty('--size', (12 + Math.floor(Math.random()*23))+'px');
      item.style.setProperty('--opacity', (.09 + Math.random()*.19).toFixed(2));
      item.style.setProperty('--rotate', (-27 + Math.floor(Math.random()*55))+'deg');
      scatter.appendChild(item);
    }


    // Decorative labels must never cover the content, controls or brand.
    // Check their real rendered bounds after webfonts finish loading.
    const removeOverlaps = () => {
      const zones = elements.map(element => element.getBoundingClientRect());
      for (const bit of [...scatter.children]) {
        const box = bit.getBoundingClientRect();
        if (zones.some(zone => box.left < zone.right + 24 && box.right > zone.left - 24 &&
                    box.top < zone.bottom + 24 && box.bottom > zone.top - 24)) bit.remove();
      }
    };
    removeOverlaps();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(removeOverlaps);
    window.addEventListener('resize', removeOverlaps);


    // Fonts and randomized alignment must never send readable UI offscreen.
    const fitContent = () => {
      const shell = document.getElementById('error-shell');
      const main = shell.querySelector('.main');
      const content = shell.querySelector('.content');
      const status = shell.querySelector('.status');
      const mainBounds = main.getBoundingClientRect();
      const viewport = document.documentElement.clientWidth;
      // Clamp the 404 lettering to its available width, including rare font variants.
      status.style.fontSize = '';
      const maxWidth = Math.min(mainBounds.width - 20, viewport - 48);
      let fontSize = parseFloat(getComputedStyle(status).fontSize);
      while (fontSize > 52 && status.scrollWidth > maxWidth) {
        fontSize = Math.max(52, fontSize * .9);
        status.style.fontSize = fontSize + 'px';
      }
      const rect = content.getBoundingClientRect();
      const heading = content.querySelector('h1').getBoundingClientRect();
      const misfit = [rect,heading,status.getBoundingClientRect()].some(b => b.left < 14 || b.right > viewport - 14);
      if (misfit) {
        shell.dataset.layout = 'left';
        content.style.transform = 'none';
        content.style.alignItems = 'flex-start';
        content.style.textAlign = 'left';
      }
    };
    fitContent();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitContent);
    window.addEventListener('resize', fitContent);

    // Secret keyboard Easter eggs work entirely inside this static page.
    const secrets = {
      PICO: 'Pico checked the route. It is still a 404.',
      CPU: 'Pico CPU: FETCH → DECODE → 404.',
      OUTPUT: 'Pico says OUTPUT "404, but make it educational."',
      FLOW: 'Pico flowchart: START → PAGE NOT FOUND → END.',
      LOGIC: 'Pico logic simulator confirms PAGE_EXISTS = 0.'
    };
    let typed = '';
    let toastTimeout;
    const toast = document.getElementById('secret-toast');
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
      if (event.target instanceof HTMLElement && event.target.matches('input,textarea,[contenteditable]')) return;
      typed = (typed + event.key.toUpperCase()).slice(-24);
      const key = Object.keys(secrets).find(word => typed.endsWith(word));
      if (!key) return;
      typed = '';
      toast.textContent = secrets[key];
      toast.hidden = false;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {toast.hidden = true;}, 5500);
    });

    // A single back action returns to the previous browser page;
    // direct visitors without history have the homepage as a safe fallback.
    document.getElementById('go-back').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.assign('/');
    });
  </script>
</body>
</html>
