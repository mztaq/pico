<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0d10">
  <link rel="icon" type="image/svg+xml" href="/pico-logo.svg">
  <title>404 | Pico</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"DM Sans",system-ui,-apple-system,sans-serif;--bg:#1e1e2e;--surface:#181825;--text:#cdd6f4;--muted:#9ba0bb;--accent:#cba6f7;--border:#393b4d;--soft:#222438;--button-text:#080a10;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:30px 20px;background:var(--bg)}
    .shell{width:min(100%,690px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.7px;text-decoration:none;color:var(--text)}
    .brand img{width:30px;height:30px}
    .brand span{color:var(--accent)}
    .rule{margin:34px 0 42px;border:0;border-top:1px solid var(--border)}
    .status{margin:8px 0 0;font-size:clamp(108px,24vw,182px);font-weight:760;line-height:1.06;letter-spacing:-.095em;color:var(--text)}
    h1{font-size:clamp(25px,4.5vw,36px);font-weight:670;letter-spacing:-1.2px;margin:12px 0}
    .sub{color:var(--muted);line-height:1.65;font-size:15px;max-width:510px;margin:0 0 30px}
    .path{display:inline-block;max-width:100%;overflow-wrap:anywhere;margin:4px 0 28px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
    .path strong{color:var(--accent);font-weight:500}
    .actions{display:flex;align-items:center;flex-wrap:wrap;gap:20px}
    .back{background:var(--accent);color:var(--button-text);padding:12px 19px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:700;transition:background .15s ease}
    .back:hover{filter:brightness(1.12)}
    .secondary{font-size:13px;color:var(--muted);text-decoration:none;border:0;background:transparent;cursor:pointer;padding:10px 0;font-family:inherit}.secondary:hover{color:var(--text)}
    @media(max-width:480px){.rule{margin:25px 0 34px}.status{font-size:112px}.footer{margin-top:40px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <a class="brand" href="/" aria-label="Pico home"><img src="/pico-logo.svg" alt="">Pico<span>.</span></a>
    <hr class="rule">
    <div class="status" aria-hidden="true">404</div>
    <h1 id="joke-title">Well, that's awkward.</h1>
    <p class="sub" id="joke-description">There's nothing at this address.</p>
    <div class="path">Tried: <strong id="missing-route">/unknown</strong></div>
    <div class="actions"><a class="back" href="/">Return to Pico →</a><button class="secondary" type="button" id="go-back">Go back</button></div>
  </main>
  <script>

    // Use the same saved preference keys and theme palette as Pico.
    const themes = {"high-contrast-red":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff9999"},"high-contrast-blue":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#82baff"},"high-contrast-yellow":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ffe45e"},"high-contrast-spectrum":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff99ff"},"high-contrast-sunset":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff9999"},"high-contrast-violet":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ff99ff"},"high-contrast-ocean":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#00ffff"},"high-contrast-ink":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#660066"},"high-contrast-forest":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#005500"},"high-contrast-dark":{"appearance":"dark","bg":"#000000","surface":"#000000","text":"#ffffff","muted":"#ffffff","accent":"#ffffff"},"high-contrast-light":{"appearance":"light","bg":"#ffffff","surface":"#ffffff","text":"#000000","muted":"#000000","accent":"#000000"},"dark-plus":{"appearance":"dark","bg":"#1e1e1e","surface":"#252526","text":"#d4d4d4","muted":"#8a8a8a","accent":"#0e7ad3"},"light-plus":{"appearance":"light","bg":"#ffffff","surface":"#f3f3f3","text":"#1f1f1f","muted":"#646464","accent":"#0066b8"},"dracula":{"appearance":"dark","bg":"#282a36","surface":"#21222c","text":"#f8f8f2","muted":"#9298bd","accent":"#bd93f9"},"monokai":{"appearance":"dark","bg":"#272822","surface":"#2b2c26","text":"#f8f8f2","muted":"#a5a294","accent":"#a6e22e"},"one-dark":{"appearance":"dark","bg":"#282c34","surface":"#21252b","text":"#abb2bf","muted":"#89909e","accent":"#61afef"},"one-light":{"appearance":"light","bg":"#fafafa","surface":"#eaeaeb","text":"#383a42","muted":"#6f727d","accent":"#4078f2"},"nord":{"appearance":"dark","bg":"#2e3440","surface":"#3b4252","text":"#d8dee9","muted":"#98a3b8","accent":"#88c0d0"},"tokyo-night":{"appearance":"dark","bg":"#1a1b26","surface":"#16161e","text":"#c0caf5","muted":"#8b93bd","accent":"#7aa2f7"},"catppuccin-mocha":{"appearance":"dark","bg":"#1e1e2e","surface":"#181825","text":"#cdd6f4","muted":"#9ba0bb","accent":"#cba6f7"},"catppuccin-latte":{"appearance":"light","bg":"#eff1f5","surface":"#e6e9ef","text":"#4c4f69","muted":"#7b7f96","accent":"#8839ef"},"gruvbox-dark":{"appearance":"dark","bg":"#282828","surface":"#32302f","text":"#ebdbb2","muted":"#b3a894","accent":"#83a598"},"solarized-dark":{"appearance":"dark","bg":"#002b36","surface":"#073642","text":"#93a1a1","muted":"#8a9a9e","accent":"#268bd2"},"solarized-light":{"appearance":"light","bg":"#fdf6e3","surface":"#eee8d5","text":"#586e75","muted":"#5f747c","accent":"#1f7fb8"},"github-dark":{"appearance":"dark","bg":"#0d1117","surface":"#161b22","text":"#c9d1d9","muted":"#8b949e","accent":"#58a6ff"},"github-light":{"appearance":"light","bg":"#ffffff","surface":"#f6f8fa","text":"#1f2328","muted":"#59636e","accent":"#0969da"},"ayu-mirage":{"appearance":"dark","bg":"#1f2430","surface":"#242936","text":"#cbccc6","muted":"#8b94a7","accent":"#ffcc66"},"night-owl":{"appearance":"dark","bg":"#011627","surface":"#0b2942","text":"#d6deeb","muted":"#93a4b0","accent":"#82aaff"},"palenight":{"appearance":"dark","bg":"#292d3e","surface":"#333747","text":"#a6accd","muted":"#8f96b8","accent":"#82aaff"},"rose-pine":{"appearance":"dark","bg":"#191724","surface":"#1f1d2e","text":"#e0def4","muted":"#a8a3bd","accent":"#c4a7e7"},"synthwave-84":{"appearance":"dark","bg":"#262335","surface":"#2a2139","text":"#ffffff","muted":"#a9add6","accent":"#f92aad"},"cobalt2":{"appearance":"dark","bg":"#193549","surface":"#122738","text":"#ffffff","muted":"#a3bacb","accent":"#ffc600"},"everforest":{"appearance":"dark","bg":"#2d353b","surface":"#343f44","text":"#d3c6aa","muted":"#859289","accent":"#a7c080"},"kanagawa":{"appearance":"dark","bg":"#1f1f28","surface":"#16161d","text":"#dcd7ba","muted":"#727169","accent":"#7e9cd8"}};
    const legacy = {dark:'dark-plus',light:'light-plus',coffee:'gruvbox-dark',matcha:'gruvbox-dark',cappuccino:'one-dark',mocha:'rose-pine',raven:'tokyo-night'};
    let chosen = 'catppuccin-mocha';
    for (const key of ['pico.settings.v6','pico.settings.v5','pico.settings.v4','pico.settings.v3']) {
      try {
        const settings = JSON.parse(localStorage.getItem(key) || 'null');
        if (settings && typeof settings === 'object') {
          const requested = settings.theme;
          chosen = themes[requested] ? requested : (legacy[requested] || 'catppuccin-mocha');
          break;
        }
      } catch { /* Use Pico's default. */ }
    }
    const theme = themes[chosen] || themes['catppuccin-mocha'];
    const root = document.documentElement;
    const mix = (a,b,t) => {
      const channel = (hex,i) => parseInt(hex.slice(i,i+2),16);
      return '#' + [1,3,5].map(i => Math.round(channel(a,i)*(1-t)+channel(b,i)*t).toString(16).padStart(2,'0')).join('');
    };
    const highContrast = chosen.startsWith('high-contrast-');
    const border = highContrast ? theme.accent : mix(theme.surface, theme.text, theme.appearance === 'dark' ? .2 : .17);
    const soft = highContrast ? theme.surface : mix(theme.surface, theme.text, theme.appearance === 'dark' ? .06 : .04);
    for (const name of ['bg','surface','text','muted','accent']) root.style.setProperty('--'+name,theme[name]);
    root.style.setProperty('--border',border);
    root.style.setProperty('--soft',soft);
    root.style.setProperty('--button-text',theme.appearance === 'dark' ? '#080a10' : '#ffffff');
    root.style.colorScheme=theme.appearance;
    document.querySelector('meta[name="theme-color"]').setAttribute('content',theme.bg);
    const route = document.getElementById('missing-route');
    route.textContent = (location.pathname + location.search).slice(0,180);
    const messages = [
      ["Well, that's awkward.", "There's nothing at this address. We checked."],
      ["This page called in sick.", "No return date. No explanation."],
      ["Even Pico can't find this one.", "And Pico is literally a compiler."],
      ["You weren't supposed to find this.", "Mostly because there's nothing here."],
      ["The page has left the chat.", "It didn't even say goodbye."],
      ["404. Impressive.", "You found a URL that leads absolutely nowhere."],
      ["This URL is fictional.", "Great concept. No actual page."],
      ["Something's missing.", "Spoiler: it's the page."],
      ["Nice try.", "Unfortunately, this route does not exist."],
      ["That link is cooked.", "The page you're looking for isn't here."]
    ];
    // Avoid showing the same joke twice in a row, including on refresh.
    let previous = -1;
    try { previous = Number(sessionStorage.getItem('pico.404.lastJoke') ?? '-1'); } catch {}
    const candidates = messages.map((_,index) => index).filter(index => index !== previous);
    const random = new Uint32Array(1);
    crypto.getRandomValues(random);
    const index = candidates[random[0] % candidates.length];
    try { sessionStorage.setItem('pico.404.lastJoke', String(index)); } catch {}
    document.getElementById('joke-title').textContent = messages[index][0];
    document.getElementById('joke-description').textContent = messages[index][1];
    document.getElementById('go-back').addEventListener('click', () => history.length > 1 ? history.back() : location.assign('/'));
  </script>
</body>
</html>
