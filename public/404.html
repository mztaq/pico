    const chance = new Uint32Array(1);
    crypto.getRandomValues(chance);
    if (chance[0] % 100 < 16) {
      const convo = conversations[Math.floor(chance[0] / 100) % conversations.length];
      const container = document.getElementById('conversation');
      document.getElementById('joke-description').hidden = true;
      document.getElementById('joke-title').textContent = 'The team is investigating.';
      for (const [speaker, line] of convo) {
        const item = document.createElement('div');
        item.className = 'conversation-line';
        const name = document.createElement('strong');
        name.textContent = speaker + ': ';
        item.append(name, document.createTextNode(line));
        container.appendChild(item);
      }
      container.hidden = false;
    }

    // Change the composition and type styles on each refresh.
    const layouts = ['left','center','right','up','down','tilt','tilt-right','stagger','reverse'];
    let previousLayout = '';
    try { previousLayout = sessionStorage.getItem('pico.404.lastLayout') || ''; } catch {}
    const otherLayouts = layouts.filter(layout => layout !== previousLayout);
    crypto.getRandomValues(random);
    const layout = otherLayouts[random[0] % otherLayouts.length];
    document.getElementById('error-shell').dataset.layout = layout;
    try { sessionStorage.setItem('pico.404.lastLayout', layout); } catch {}
    // A rare font treatment appears on roughly two percent of refreshes.
    crypto.getRandomValues(random);
    if (random[0] % 100 < 2) {
      const rare = ['tiny','inverted','stamp','large'];
      document.getElementById('error-shell').dataset.rare = rare[Math.floor(random[0] / 100) % rare.length];
    }


    const headlineFonts = [
      '"Fredoka",sans-serif','"Bricolage Grotesque",sans-serif','"Syne",sans-serif',
      '"Space Grotesk",sans-serif','"Archivo Black",sans-serif',
      '"Unbounded",sans-serif','"Righteous",sans-serif','"Outfit",sans-serif',
      '"Chakra Petch",sans-serif','"Rubik Mono One",monospace'
    ];
    const numeralFonts = [
      '"Archivo Black",sans-serif','"Space Mono",monospace','"Fredoka",sans-serif',
      '"Syne",sans-serif','"Unbounded",sans-serif','"Righteous",sans-serif',
      '"Rubik Mono One",monospace','"Chakra Petch",sans-serif','"Outfit",sans-serif',
      '"Press Start 2P",monospace'
    ];
    const pick = values => {
      const buffer = new Uint32Array(1);
      crypto.getRandomValues(buffer);
      return values[buffer[0] % values.length];
    };
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--headline',pick(headlineFonts));
    rootStyle.setProperty('--numeral',pick(numeralFonts));

    // Scatter tiny pieces of Pico around the edges, not on top of the joke.
    const glyphs = ['OUTPUT','DECLARE','404','{ }','</>','0x404','PICO','// ???',
      'NULL','ALU','FALSE','??','if (false)','NaN','FETCH',';','{404}',
      'AMAR','HAMZA','MUSTAQIM','[ ]','return 404','NOT FOUND','∞','01'];
    const scatter = document.getElementById('scatter');
    // Corners and side bands stay away from the central content area.
    const spots = [
      [4,18],[13,31],[7,72],[20,89],[33,12],[45,5],[64,8],[82,12],
      [94,27],[89,44],[94,68],[82,86],[66,95],[45,91],[31,82],
      [4,49],[16,8],[75,32],[91,91],[6,93]
    ];
    // Independent seed per refresh; vary which edge spots are used.
    const shuffled = [...spots].sort(() => Math.random() - .5);
    for (let i=0;i<16;i++){
      const item = document.createElement('span');
      item.className = 'bit';
      item.textContent = pick(glyphs);
      const [x,y] = shuffled[i];
      item.style.left = x + '%';
      item.style.top = y + '%';
      item.style.setProperty('--size', (12 + Math.floor(Math.random()*23))+'px');
      item.style.setProperty('--opacity', (.09 + Math.random()*.19).toFixed(2));
      item.style.setProperty('--rotate', (-27 + Math.floor(Math.random()*55))+'deg');
      scatter.appendChild(item);
    }


    // Decorative labels must never cover the content, controls or brand.
    // Check their real rendered bounds after webfonts finish loading.
    const removeOverlaps = () => {
      const elements = [...document.querySelectorAll('.brand,.status,h1,.sub:not([hidden]),.conversation:not([hidden]),.actions')];
      const zones = elements.map(element => element.getBoundingClientRect());
      for (const bit of [...scatter.children]) {
        const box = bit.getBoundingClientRect();
        if (zones.some(zone => box.left < zone.right + 24 && box.right > zone.left - 24 &&
                    box.top < zone.bottom + 24 && box.bottom > zone.top - 24)) bit.remove();
      }
    };
    removeOverlaps();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(removeOverlaps);
    window.addEventListener('resize', removeOverlaps);

    // Secret keyboard Easter eggs work entirely inside this static page.
    const secrets = {
      PICO: 'PICO activated. Still no page. Incredible.',
      AMAR: 'Amar has been summoned. Expect 14 new features.',
      HAMZA: 'Hamza is reviewing the business concept. Marketing a 404 is ambitious.',
      MUSTAQIM: 'Mustaqim is deploying... still 404.',

    let toastTimeout;
    const toast = document.getElementById('secret-toast');
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
      if (event.target instanceof HTMLElement && event.target.matches('input,textarea,[contenteditable]')) return;
      typed = (typed + event.key.toUpperCase()).slice(-24);
      const key = Object.keys(secrets).find(word => typed.endsWith(word));
      if (!key) return;
      typed = '';
      toast.textContent = secrets[key];
      toast.hidden = false;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {toast.hidden = true;}, 5500);
    });

    // A single back action returns to the previous browser page;
    // direct visitors without history have the homepage as a safe fallback.
    document.getElementById('go-back').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.assign('/');
    });
