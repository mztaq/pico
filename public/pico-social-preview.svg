<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pico. Built by students, for students.</title>
  <desc id="desc">Compact Pico link preview with the six tools: Pseudocode, Python, Flowcharts, Logic, CPU Studio and Binary Lab.</desc>
  <defs>
    <linearGradient id="card-bg" x1="0" y1=".55" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0e19"/>
      <stop offset=".56" stop-color="#111020"/>
      <stop offset="1" stop-color="#211b3e"/>
    </linearGradient>
  </defs>
  <!-- Match the original compact share card: no product mockups or artwork. -->
  <rect width="1200" height="630" fill="#0b0d17"/>
  <rect x="46" y="44" width="1108" height="538" rx="22" fill="url(#card-bg)" stroke="#4a4667" stroke-width="1.8"/>
  <!-- Pico logo: same shape and color as the real site asset. -->
  <g transform="translate(98 142) scale(1.26)">
    <rect x="4" y="4" width="120" height="120" rx="34" fill="#8179ef"/>
    <path d="M39 29h35a24 24 0 0 1 0 48H53v24H39V29Zm14 14v20h21a10 10 0 0 0 0-20H53Z" fill="#11121a"/>
    <circle cx="90" cy="93" r="8" fill="#c9c4ff"/>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="288" y="246" font-size="103" font-weight="750" letter-spacing="-5.4" fill="#f2f1fa">Pico.</text>
    <text x="291" y="296" font-size="31" font-weight="400" fill="#d3d5e5">Built by students, for students.</text>
    <path d="M105 363 H 1096" stroke="#4a4961" stroke-width="1.5"/>
    <g fill="#222333" stroke="#51506c" stroke-width="1.4">
      <rect x="106" y="411" width="151" height="48" rx="7"/>
      <rect x="274" y="411" width="108" height="48" rx="7"/>
      <rect x="398" y="411" width="150" height="48" rx="7"/>
      <rect x="564" y="411" width="85" height="48" rx="7"/>
      <rect x="665" y="411" width="144" height="48" rx="7"/>
      <rect x="825" y="411" width="146" height="48" rx="7"/>
    </g>
    <g font-size="17.3" font-weight="500" fill="#e0e1f5" text-anchor="middle">
      <text x="181.5" y="442">PSEUDOCODE</text>
      <text x="328" y="442">PYTHON</text>
      <text x="473" y="442">FLOWCHARTS</text>
      <text x="606.5" y="442">LOGIC</text>
      <text x="737" y="442">CPU STUDIO</text>
      <text x="898" y="442">BINARY LAB</text>
    </g>
    <text x="107" y="540" font-size="21" fill="#abb0c6">picompiler.pages.dev</text>
