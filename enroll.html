<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/svg+xml" href="/pico-logo.svg">
  <link rel="stylesheet" href="/enroll/enroll.css">
  <title>Pico</title>
</head>
<body>
  <main class="shell" id="shell">
    <section class="panel" id="not-found">
      <h1>404 Not Found</h1>
      <p>The page you requested is unavailable.</p>
    </section>
    <section class="panel" id="activate" hidden>
      <div class="brand"><img src="/pico-logo.svg" width="38" height="38" alt="">Pico. <span>Device approval</span></div>
      <h1>Approve this browser</h1>
      <p>This is a private, single-use invitation. Once approved, this browser will open Pico Status Admin automatically for 30 days.</p>
      <p>Only approve a personal browser. Do not use a shared or school computer.</p>
      <button id="approve" type="button">Approve this browser</button>
      <p class="result" id="result" role="status"></p>
    </section>
  </main>
  <script src="/enroll/enroll.js" defer></script>
</body>
</html>
