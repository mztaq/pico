name: Publish Pico installers to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect existing release before updating its three installers
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v0.1.0-build.10
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected_new=$(printf '%s\n' Pico_x64-setup.exe Pico_universal.dmg Pico_amd64.AppImage | sort)
          expected_old=$(printf '%s\n' Pico_x64-setup.exe Pico_x64_en-US.msi Pico_aarch64.dmg Pico_x64.dmg Pico_amd64.deb Pico_amd64.AppImage | sort)
          if [[ "$actual" == "$expected_new" ]]; then
            echo "migrate=false" >> "$GITHUB_OUTPUT"
            echo "Already three assets in the original release."
            exit 0
          fi
          if [[ "$actual" != "$expected_old" ]]; then
            echo "::error::Unexpected release asset list. Refusing to modify the release." >&2
            printf 'Actual assets:\n%s\n' "$actual"
            exit 1
          fi
          echo "migrate=true" >> "$GITHUB_OUTPUT"
          mkdir -p previous-release-assets replacement-artifacts release-staging
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir previous-release-assets --pattern 'Pico_*'
          # Use only the already successful OS builds from PR #94, not unverified binaries.
          gh run download 41126752856 --repo "$GITHUB_REPOSITORY" --pattern 'pico-*' --dir replacement-artifacts
          find replacement-artifacts -type f -name 'Pico_*' -print0 |
            while IFS= read -r -d '' file; do cp "$file" release-staging/; done
          python3 - <<'PY'
          from pathlib import Path
          expected={'Pico_x64-setup.exe','Pico_universal.dmg','Pico_amd64.AppImage'}
          found={p.name for p in Path('release-staging').iterdir() if p.is_file()}
          assert found==expected, f'Unexpected built installers: {found}'
          for name in expected:
            path=Path('release-staging')/name
            assert path.stat().st_size > 100_000, f'Invalid binary length: {name}'
            print('Prepared verified-build asset',name,path.stat().st_size)
          PY
      - name: Back up all old installers before modifying the sole existing release
        if: steps.release_state.outputs.migrate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backup-six-original-pico-installers
          path: previous-release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Replace original release assets with exactly three installers
        if: steps.release_state.outputs.migrate == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v0.1.0-build.10
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-staging/* --clobber --repo "$GITHUB_REPOSITORY"
          for obsolete in Pico_x64_en-US.msi Pico_aarch64.dmg Pico_x64.dmg Pico_amd64.deb; do
            gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes --repo "$GITHUB_REPOSITORY"
          done
          actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=$(printf '%s\n' Pico_x64-setup.exe Pico_universal.dmg Pico_amd64.AppImage | sort)
          test "$actual" = "$expected"
          echo "Updated the same release. No new release was created."
      - name: Retrieve existing Pico desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-binaries
          gh release download desktop-v0.1.0-build.10 --repo "$GITHUB_REPOSITORY" --dir release-binaries --pattern 'Pico_*'
      - name: Split and verify release files
        run: node scripts/stage-desktop-downloads.mjs release-binaries public/download-assets
      - name: Render public PNG for social link previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert --width 1200 --height 630 public/pico-social-preview.svg --output public/social-preview.png
          file public/social-preview.png
          test "$(stat -c %s public/social-preview.png)" -gt 10000
      - name: Build and check
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Publish Pages site with installers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy dist --project-name picompiler --branch main | tee "$RUNNER_TEMP/pico-deployment.log"
      - name: Verify public installers and reconstructed SHA-256
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('public/download-assets/manifest.json').read_text())
          import re
          deploy_log = Path(__import__('os').environ['RUNNER_TEMP'], 'pico-deployment.log').read_text()
          match = re.search(r'https://[a-z0-9]+\.picompiler\.pages\.dev', deploy_log)
          assert match, 'Wrangler deploy URL missing from output'
          preview_url = match.group(0)
          print('Testing immutable deployment:', preview_url, flush=True)
          for base in [preview_url, 'https://picompiler.pages.dev']:
              for path in ['/download-assets/manifest.json', '/downloads/Pico_x64-setup.exe']:
                  req = urllib.request.Request(base + path, method='HEAD', headers={'User-Agent': 'PicoDownloadVerifier/1.0'})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response: print(base, path, response.status, response.headers.get('Content-Type'), flush=True)
                  except Exception as exc: print(base, path, exc, flush=True)
          for name, details in manifest['files'].items():
              url = 'https://picompiler.pages.dev/downloads/' + name
              last_error = None
              for attempt in range(8):
                  try:
                      digest = hashlib.sha256()
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 PicoDownloadVerifier/1.0', 'Accept': '*/*'}), timeout=180) as response:
                          assert response.status == 200, (name, response.status)
                          while block := response.read(1 << 20):
                              digest.update(block)
                      assert digest.hexdigest() == details['sha256'], name + ': checksum mismatch'
                      print('Verified', name, details['size'], digest.hexdigest())
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f'Attempt {attempt + 1} failed for {url}: {exc}', flush=True)
                      if hasattr(exc, 'read'):
                          print('Response body:', exc.read(750).decode('utf-8', errors='replace'), flush=True)
                      if attempt == 7:
                          raise
                      time.sleep(8)
          PY
