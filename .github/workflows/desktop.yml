name: Desktop installers

# Build one installer for each operating system. Existing public release is
# never replaced automatically by a pull request, merge, or web-only change.
on:
  workflow_dispatch:
    inputs:
      publish_existing_release:
        type: boolean
        description: 'After verifying CI, replace installers in existing desktop-v0.1.0-build.10 release only'
        default: false
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'public/pico-logo.svg'
      - 'scripts/stage-desktop-artifact.mjs'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'public/pico-logo.svg'
      - 'scripts/stage-desktop-artifact.mjs'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            platform: windows
            bundles: nsis
            target_flags: ''
          - name: macOS
            runner: macos-latest
            platform: macos
            bundles: dmg
            target_flags: '--target universal-apple-darwin'
          - name: Linux
            runner: ubuntu-22.04
            platform: linux
            bundles: appimage
            target_flags: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable universal Apple Silicon and Intel build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2
      - name: Generate desktop icons
        run: tauri icon public/pico-logo.svg --output src-tauri/icons
      - name: Build one desktop installer
        run: tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target_flags }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Stage one platform installer
        run: node scripts/stage-desktop-artifact.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: pico-${{ matrix.platform }}-${{ github.sha }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14

  validate-web:
    name: Verify tests and production build before any release replacement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  # Manual main-branch action only. NEVER create a second release or publish
  # a PR's binaries. Keep an artifact backup of the currently published files.
  publish-existing-release:
    name: Update the existing single Pico release
    needs: [validate-web, build-desktop]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pico-existing-desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pico-*
          path: release-staging
          merge-multiple: true
      - name: Verify three built assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected={'Pico_x64-setup.exe','Pico_universal.dmg','Pico_amd64.AppImage'}
          files={p.name for p in Path('release-staging').iterdir() if p.is_file()}
          assert files==expected, f'Expected exactly 3 OS installers, got {files}'
          for p in Path('release-staging').iterdir():
              assert p.stat().st_size > 0, f'Empty installer: {p}'
              print(p.name, p.stat().st_size)
          PY
      - name: Back up old assets from existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v0.1.0-build.10
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir -p previous-release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir previous-release-assets --pattern 'Pico_*'
      - uses: actions/upload-artifact@v7
        with:
          name: previous-pico-release-assets
          path: previous-release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Replace only the existing release's installer assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v0.1.0-build.10
        shell: bash
        run: |
          set -euo pipefail
          # Only the existing release is modified, never created or deleted.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$TAG" release-staging/* --clobber --repo "$GITHUB_REPOSITORY"
          for obsolete in Pico_x64_en-US.msi Pico_aarch64.dmg Pico_x64.dmg Pico_amd64.deb; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset "$TAG" "$obsolete" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done
          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=$(printf '%s\n' Pico_x64-setup.exe Pico_universal.dmg Pico_amd64.AppImage | sort)
          test "$actual" = "$expected"
          echo "Existing $TAG contains exactly one Windows, one universal macOS, and one Linux installer."
