name: Tests and production build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Browser smoke-test production Pico Arena bundle
        run: |
          pnpm preview -- --host 127.0.0.1 > /tmp/pico-vite-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          node scripts/smoke-pico-arena.mjs
      - name: Bundle memory-only arena Worker
        run: npx --yes wrangler@4 deploy --dry-run --config workers/pico-arena/wrangler.jsonc
