    <script>
      if (location.pathname !== '/' && location.pathname !== '/index.html' || window.isTauri === true || window.__TAURI_INTERNALS__) {

    <style>
      .pico-app-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#15131e;color:#cdd6f4;font:600 14px system-ui,sans-serif}.pico-app-loader img{width:60px;height:60px}.pico-initial-app-loader{display:none}.pico-app-route .pico-initial-app-loader{display:flex}.pico-app-route .pico-loading{display:none}
      html, body { margin: 0; min-height: 100%; background: #15131e; }
      .pico-loading{min-height:100vh;background:#15131e;padding:24px clamp(20px,6vw,90px);box-sizing:border-box}.pico-skeleton-nav,.pico-skeleton-hero,.pico-skeleton-cards{max-width:1280px;margin:auto}.pico-skeleton-nav{display:flex;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid #302a3b}.pico-skeleton-links{display:flex;align-items:center;gap:32px;margin-left:auto}.pico-skeleton{background:linear-gradient(100deg,#292333 20%,#393044 40%,#292333 60%);background-size:200% 100%;animation:pico-shimmer 1.6s ease-in-out infinite;border-radius:8px}.pico-skeleton-logo{width:110px;height:32px}.pico-skeleton-link{width:62px;height:15px}.pico-skeleton-link:last-child{width:85px}.pico-skeleton-hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center;padding:clamp(60px,10vw,130px) 0}.pico-skeleton-copy{display:grid;gap:18px}.pico-skeleton-title{height:46px;width:80%}.pico-skeleton-line{height:17px;width:62%}.pico-skeleton-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}.pico-skeleton-button{height:49px;width:180px;border-radius:7px}.pico-skeleton-button:last-child{width:205px}.pico-skeleton-preview{height:300px;border-radius:14px}.pico-skeleton-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pico-skeleton-card{height:150px;border-radius:14px}.pico-loading-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pico-shimmer{to{background-position:-200% 0}}@media(max-width:700px){.pico-skeleton-links{display:none}.pico-skeleton-hero{grid-template-columns:1fr;padding:55px 0}.pico-skeleton-preview{height:220px}.pico-skeleton-cards{grid-template-columns:1fr}.pico-skeleton-card{height:110px}}@media(prefers-reduced-motion:reduce){.pico-skeleton{animation:none}}

      /* Match the final navigation's height and placement during loading. */
      .pico-loading{padding:0}.pico-skeleton-nav{box-sizing:border-box;max-width:none;height:74px;padding:0 max(40px,calc((100% - 1280px)/2));border-bottom:1px solid #302a3b}.pico-skeleton-hero,.pico-skeleton-cards{width:min(1280px,calc(100% - 80px))}
      @media(max-width:700px){.pico-skeleton-nav{height:66px;padding-inline:19px}.pico-skeleton-hero,.pico-skeleton-cards{width:calc(100% - 40px)}}
    </style>

    <div id="root"><div class="pico-loading" role="status"><span class="pico-loading-label">Loading Pico…</span><div aria-hidden="true"><div class="pico-skeleton-nav"><div class="pico-skeleton pico-skeleton-logo"></div><div class="pico-skeleton-links"><div class="pico-skeleton pico-skeleton-link" data-placeholder-for="#home"></div><div class="pico-skeleton pico-skeleton-link" data-placeholder-for="#features"></div><div class="pico-skeleton pico-skeleton-link" data-placeholder-for="#downloads"></div></div></div><div class="pico-skeleton-hero"><div class="pico-skeleton-copy"><div class="pico-skeleton pico-skeleton-title"></div><div class="pico-skeleton pico-skeleton-title"></div><div class="pico-skeleton pico-skeleton-line"></div><div class="pico-skeleton-actions"><div class="pico-skeleton pico-skeleton-button" data-placeholder-for="/app"></div><div class="pico-skeleton pico-skeleton-button" data-placeholder-for="#downloads"></div></div></div><div class="pico-skeleton pico-skeleton-preview"></div></div><div class="pico-skeleton-cards"><div class="pico-skeleton pico-skeleton-card"></div><div class="pico-skeleton pico-skeleton-card"></div><div class="pico-skeleton pico-skeleton-card"></div></div></div></div><div class="pico-app-loader pico-initial-app-loader" role="status"><img src="/pico-logo.svg" alt=""><span>Loading Pico…</span></div></div>
