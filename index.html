    <style>
      .pico-loading{min-height:100vh;background:#15131e;padding:24px clamp(20px,6vw,90px);box-sizing:border-box}.pico-skeleton-nav,.pico-skeleton-hero,.pico-skeleton-cards{max-width:1280px;margin:auto}.pico-skeleton-nav{display:flex;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid #302a3b}.pico-skeleton-nav .pico-skeleton:last-child{margin-left:auto}.pico-skeleton{background:linear-gradient(100deg,#292333 20%,#393044 40%,#292333 60%);background-size:200% 100%;animation:pico-shimmer 1.6s ease-in-out infinite;border-radius:8px}.pico-skeleton-logo{width:110px;height:32px}.pico-skeleton-link{width:75px;height:15px}.pico-skeleton-hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,80px);align-items:center;padding:clamp(60px,10vw,130px) 0}.pico-skeleton-copy{display:grid;gap:18px}.pico-skeleton-title{height:46px;width:80%}.pico-skeleton-line{height:17px;width:62%}.pico-skeleton-button{height:44px;width:180px;margin-top:12px}.pico-skeleton-preview{height:300px;border-radius:14px}.pico-skeleton-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pico-skeleton-card{height:150px;border-radius:14px}.pico-loading-label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pico-shimmer{to{background-position:-200% 0}}@media(max-width:700px){.pico-skeleton-link{display:none}.pico-skeleton-hero{grid-template-columns:1fr;padding:55px 0}.pico-skeleton-preview{height:220px}.pico-skeleton-cards{grid-template-columns:1fr}.pico-skeleton-card{height:110px}}@media(prefers-reduced-motion:reduce){.pico-skeleton{animation:none}}

    </style>

  <body>
    <div id="root"><div class="pico-loading" role="status"><span class="pico-loading-label">Loading Pico…</span><div aria-hidden="true"><div class="pico-skeleton-nav"><div class="pico-skeleton pico-skeleton-logo"></div><div class="pico-skeleton pico-skeleton-link"></div><div class="pico-skeleton pico-skeleton-link"></div></div><div class="pico-skeleton-hero"><div class="pico-skeleton-copy"><div class="pico-skeleton pico-skeleton-title"></div><div class="pico-skeleton pico-skeleton-title"></div><div class="pico-skeleton pico-skeleton-line"></div><div class="pico-skeleton pico-skeleton-button"></div></div><div class="pico-skeleton pico-skeleton-preview"></div></div><div class="pico-skeleton-cards"><div class="pico-skeleton pico-skeleton-card"></div><div class="pico-skeleton pico-skeleton-card"></div><div class="pico-skeleton pico-skeleton-card"></div></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
