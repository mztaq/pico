<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="description" content="Live availability and incident history for Pico services.">
  <link rel="icon" type="image/svg+xml" href="/pico-logo.svg">
  <title>Pico Status</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e2e;
      --panel: #252536;
      --panel-hover: #2b2b3f;
      --edge: #424258;
      --line: #3a3a50;
      --text: #cdd6f4;
      --bright: #f5f2ff;
      --muted: #a6adc8;
      --accent: #cba6f7;
      --green: #a6e3a1;
      --amber: #f9e2af;
      --red: #f38ba8;
      --no-data: #4b4b62;
    }
    * { box-sizing: border-box; }
    html { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); background:
      radial-gradient(ellipse 640px 250px at 50% 0, rgba(203,166,247,.055), transparent 80%),
      var(--bg);
      font-size: 15px; line-height: 1.55;
    }
    a { text-decoration: none; color: inherit; }
    a:hover { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 3px; }
    .container { width: min(100% - 40px, 850px); margin: 0 auto; }
    header { border-bottom: 1px solid rgba(205,214,244,.085); }
    .nav { min-height: 88px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .brand { display: flex; gap: 10px; align-items: center; color: var(--bright); font-size: 20px; font-weight: 800; letter-spacing: -.85px; white-space: nowrap; }
    .brand img { width: 36px; height: 36px; }
    .brand .divider { width: 1px; height: 22px; background: var(--edge); margin: 0 6px 0 8px; }
    .brand .suffix { color: var(--muted); font-size: 14px; font-weight: 500; letter-spacing: 0; }
    .back { color: var(--muted); font-size: 13px; font-weight: 550; white-space: nowrap; }
    .back:hover { color: var(--bright); }
    main { padding: 55px 0 98px; }
    h1,h2,h3,p { margin-top: 0; }
    h1 { font-size: clamp(29px, 5vw, 38px); font-weight: 770; line-height: 1.16; letter-spacing: -1.5px; color: var(--bright); margin-bottom: 24px; }
    .overall {
      position: relative; display: flex; align-items: center;
      overflow: hidden; min-height: 120px; padding: 31px 33px;
      border: 1px solid rgba(166,227,161,.34); border-radius: 12px;
      background: linear-gradient(100deg, rgba(166,227,161,.095), rgba(166,227,161,.02) 72%), var(--panel);
      isolation: isolate;
    }
    .overall::before {
      content: ""; position: absolute; width: 4px; top: 0; bottom: 0; left: 0;
      background: var(--green);
    }
    .overall::after {
      content: ""; position: absolute; right: -62px; top: -110px;
      width: 300px; height: 300px; border: 1px solid rgba(166,227,161,.09);
      border-radius: 50%; box-shadow: 0 0 0 45px rgba(166,227,161,.018), 0 0 0 95px rgba(166,227,161,.014);
      pointer-events: none; z-index: -1;
    }
    .overall[data-tone="down"] { border-color: rgba(243,139,168,.38); background: linear-gradient(100deg, rgba(243,139,168,.09), transparent 80%),var(--panel); }
    .overall[data-tone="warn"] { border-color: rgba(249,226,175,.36); background: linear-gradient(100deg, rgba(249,226,175,.08), transparent 80%),var(--panel); }
    .overall[data-tone="unknown"] { border-color: var(--edge); background: var(--panel); }
    .overall[data-tone="down"]::before { background: var(--red); }
    .overall[data-tone="warn"]::before { background: var(--amber); }
    .overall[data-tone="unknown"]::before { background: var(--accent); }
    .overall h2 { margin: 0; color: var(--bright); font-size: clamp(21px,3.6vw,27px); letter-spacing: -.9px; line-height: 1.28; font-weight: 720; }
    .overall[data-tone="up"] h2 { color: #def2dc; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 47px 0 17px; }
    .section-heading h2 { font-size: 22px; line-height: 1.28; color: var(--bright); font-weight: 720; letter-spacing: -.65px; margin: 0; }
    .range { color: var(--muted); font-size: 13px; font-weight: 500; }
    .services,.incidents { overflow: hidden; border: 1px solid var(--edge); border-radius: 13px; background: var(--panel); }
    .service { padding: 27px 29px 24px; border-bottom: 1px solid var(--line); transition: background .15s; }
    .service:last-child { border-bottom: 0; }
    @media(hover:hover) { .service:hover { background: var(--panel-hover); } }
    .service-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .service-name { color: var(--bright); font-size: 19px; line-height: 1.3; font-weight: 720; letter-spacing: -.35px; }
    .service-state { font-size: 14px; font-weight: 670; white-space: nowrap; color: var(--muted); }
    .service-state.up { color: var(--green); }
    .service-state.down { color: var(--red); }
    .service-state.warn { color: var(--amber); }
    .history { margin-top: 20px; display: grid; grid-template-columns: repeat(30,minmax(0,1fr)); gap: 4px; }
    .day { height: 30px; display: block; min-width: 0; border-radius: 3px; background: var(--no-data); }
    .day.up { background: var(--green); }
    .day.down { background: var(--red); }
    .day.warn { background: var(--amber); }
    @media(hover:hover) { .day:hover { filter: brightness(1.15); } }
    .service-footer { margin-top: 13px; display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
    .period { color: var(--muted); font-size: 12px; }
    .uptime { font-size: 16px; font-weight: 710; color: var(--bright); font-variant-numeric: tabular-nums; }
    .uptime.missing { font-size: 13px; font-weight: 520; color: var(--muted); }
    .empty { padding: 25px 29px; color: var(--bright); font-size: 16px; font-weight: 570; }
    .incident { padding: 23px 29px; border-bottom: 1px solid var(--line); }
    .incident:last-child { border: 0; }
    .incident-top { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; }
    .incident h3 { margin: 0; color: var(--bright); font-size: 17px; letter-spacing: -.2px; }
    .incident .state { color: var(--amber); font-size: 13px; font-weight: 660; white-space: nowrap; }
    .incident .state.resolved { color: var(--green); }
    .incident p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .incident time { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; }
    footer { border-top: 1px solid rgba(205,214,244,.085); }
    .foot { text-align: center; padding: 30px 0; color: var(--muted); font-size: 12px; }
    @media(max-width:620px) {
      .container { width: calc(100% - 30px); }
      .nav { min-height: 72px; }
      .brand { font-size: 18px; gap: 8px; }
      .brand img { width: 31px; height: 31px; }
      .brand .divider { margin-left: 5px; margin-right: 2px; height: 18px; }
      .brand .suffix, .back { font-size: 12px; }
      main { padding: 40px 0 72px; }
      h1 { margin-bottom: 19px; }
      .overall { min-height: 106px; padding: 26px 23px; }
      .section-heading { margin-top: 38px; }
      .section-heading h2 { font-size: 20px; }
      .service { padding: 23px 18px 21px; }
      .service-name { font-size: 17px; }
      .service-state { font-size: 13px; }
      .history { gap: 3px; margin-top: 18px; }
      .day { height: 28px; border-radius: 2px; }
      .uptime { font-size: 15px; }
      .empty,.incident { padding: 21px 18px; }
    }
    @media(max-width:370px) {
      .history { gap: 2px; }
      .day { height: 24px; border-radius: 1px; }
      .service-top { align-items: center; }
      .service-name { font-size: 16px; }
      .service-state { font-size: 12px; }
      .back { font-size: 11px; }
    }
    @media(prefers-reduced-motion:reduce) { .service { transition: none; } }
  </style>
</head>
<body>
  <header>
    <nav class="container nav" aria-label="Main navigation">
      <a class="brand" href="https://picompiler.pages.dev/" aria-label="Pico home">
        <img src="/pico-logo.svg" alt="" width="36" height="36">
        <span>Pico.</span><span class="divider"></span><span class="suffix">Status</span>
      </a>
      <a class="back" href="https://picompiler.pages.dev/">← Back to Pico</a>
    </nav>
  </header>
  <main class="container">
    <h1>System status</h1>
    <section class="overall" id="overall-panel" data-tone="unknown" aria-live="polite" role="status">
      <h2 id="overall-title">Checking system status</h2>
    </section>

    <section aria-labelledby="services-heading">
      <div class="section-heading">
        <h2 id="services-heading">Services</h2><span class="range">Last 30 days</span>
      </div>
      <div class="services" id="services"><div class="empty">Checking services…</div></div>
    </section>

    <section aria-labelledby="incidents-heading">
      <div class="section-heading"><h2 id="incidents-heading">Incident history</h2><a class="range" href="/history">View full history →</a></div>
      <div class="incidents" id="incidents"><div class="empty">Checking incidents…</div></div>
    </section>
  </main>
  <footer>
    <div class="container foot"><a href="https://picompiler.pages.dev/app/ai-usage">© 2026 Pico Development Team. All rights reserved.</a></div>
  </footer>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const DAY = 86400000;
    const DEFAULTS = [
      {id:"website",name:"Pico Website",status:"unknown"},
      {id:"mcp",name:"Pico MCP",status:"unknown"},
      {id:"oauth",name:"Pico OAuth",status:"unknown"}
    ];
    const STATES = {
      up: ["Operational","up"],
      down: ["Outage","down"],
      degraded: ["Degraded","warn"],
      paused: ["Paused","warn"],
      starting: ["Starting",""],
      not_monitored: ["Not monitored",""],
      unknown: ["No data",""]
    };
    const dateFmt = new Intl.DateTimeFormat(undefined,{day:"numeric",month:"short",timeZone:"UTC"});
    const clean = value => String(value ?? "").replace(/[&<>"']/g,c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function setOverall(title,tone) {
      $("overall-title").textContent=title;
      $("overall-panel").dataset.tone=tone;
    }
    function renderServices(items, timestamp) {
      const updated=typeof timestamp==="string" && Number.isFinite(Date.parse(timestamp)) ? new Date(timestamp) : new Date();
      $("services").innerHTML=items.map(service => {
        const [label,tone]=STATES[service.status]||STATES.unknown;
        const days=Array.isArray(service.history)&&service.history.length===30 ? service.history : Array(30).fill(null);
        const bars=days.map((status,index) => {
          const day=new Date(updated.getTime()-(29-index)*DAY);
          const [meaning,kind] = status==="up"?["Operational","up"]:status==="down"?["Outage","down"]:status==="degraded"?["Degraded","warn"]:["No data",""];
          return '<span class="day '+kind+'" title="'+clean(dateFmt.format(day)+" · "+meaning)+'" aria-hidden="true"></span>';
        }).join("");
        const uptime=typeof service.uptime30d==="number"&&Number.isFinite(service.uptime30d)
          ? service.uptime30d.toFixed(2)+"% uptime" : "Uptime unavailable";
        return '<article class="service"><div class="service-top"><span class="service-name">'+clean(service.name)+'</span><span class="service-state '+tone+'">'+clean(label)+'</span></div>'
          + '<div class="history" role="img" aria-label="30-day history for '+clean(service.name)+'">'+bars+'</div>'
          + '<div class="service-footer"><span class="period">30 days ago</span><span class="uptime'+(uptime==="Uptime unavailable"?" missing":"")+'">'+clean(uptime)+'</span></div></article>';
      }).join("");
    }
    function renderIncidents(incidents) {
      if(!Array.isArray(incidents)) {
        $("incidents").innerHTML='<div class="empty">Incident history unavailable</div>';
        return;
      }
      if(incidents.length===0) {
        $("incidents").innerHTML='<div class="empty">No incidents</div>';
        return;
      }
      $("incidents").innerHTML=incidents.map(incident => {
        const when=incident.startedAt?new Date(incident.startedAt):null;
        const displayed=when&&Number.isFinite(when.getTime())?when.toLocaleString():null;
        const stages={investigating:"Investigating",identified:"Identified",monitoring:"Monitoring",resolved:"Resolved"};
        const stage=stages[incident.status]||(incident.resolvedAt?"Resolved":"Investigating");
        return '<article class="incident"><div class="incident-top"><h3>'+clean(incident.title||incident.service||"Pico")+'</h3>'
          + '<span class="state '+(stage==="Resolved"?"resolved":"")+'">'+stage+'</span></div>'
          + '<p>'+clean(incident.reason||"Service interruption")+'</p>'
          + (displayed?'<time>'+clean(displayed)+'</time>':"")+'</article>';
      }).join("");
    }
    let loading=false;
    async function refresh() {
      if(loading) return;
      loading=true;
      try {
        const response=await fetch("/api/status",{cache:"no-store"});
        if(!response.ok) throw Error("Unavailable");
        const data=await response.json();
        const services=Array.isArray(data.services)?data.services:DEFAULTS;
        renderServices(services,data.updatedAt);
        if(data.state!=="connected"){
          setOverall("Status unavailable","unknown");
          renderIncidents(null);
        }else{
          const down=services.some(s=>s.status==="down");
          const degraded=services.some(s=>s.status==="degraded");
          const unverified=services.some(s=>!["up","down","degraded"].includes(s.status));
          if(down)setOverall("Service disruption","down");
          else if(degraded)setOverall("Some services experiencing issues","warn");
          else if(unverified)setOverall("Partial monitoring","warn");
          else setOverall("All systems operational","up");
          renderIncidents(data.incidents);
        }
      }catch {
        renderServices(DEFAULTS);
        renderIncidents(null);
        setOverall("Status unavailable","unknown");
      }finally {loading=false}
    }
    refresh();
    setInterval(()=>{if(!document.hidden)refresh()},300000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
  })();
  </script>
</body>
</html>
