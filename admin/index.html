<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/pico-logo.svg">
<title>Incident Management | Pico</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header><nav class="wrap"><a class="brand" href="https://picompiler.pages.dev/"><img src="/pico-logo.svg" alt="">Pico.<span class="split"></span><span class="sub">Admin</span></a><a class="link" href="/">Public status ↗</a></nav></header>
<main class="wrap">
  <h1>Incident management</h1>
  <p class="lead">Publish updates to Pico's public status page.</p>
  <div class="grid">
    <section class="panel" aria-labelledby="incidents-heading">
      <div class="panel-head"><h2 id="incidents-heading">Incidents</h2></div>
      <div id="incidents" class="incident-list"><div class="picker-empty">Loading incidents…</div></div>
      <div class="body body-split">
        <h3 class="update-head compact">Publish update</h3>
        <p id="selection" class="selected">Select an incident above.</p>
        <form id="update-form" hidden>
          <div class="group"><label for="stage">Stage</label>
            <select class="field" id="stage" required>
              <option value="investigating">Investigating</option>
              <option value="identified">Identified</option>
              <option value="monitoring">Monitoring</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>
          <div class="group"><label for="update-message">Public message</label>
            <textarea class="field" id="update-message" minlength="10" maxlength="650" required placeholder="Describe what's happening and what the team is doing."></textarea>
          </div>
          <button id="publish-update" class="primary" type="submit">Publish update</button>
          <p id="update-result" class="notice" role="status"></p>
        </form>
      </div>
    </section>
    <section class="panel" aria-labelledby="new-heading">
      <div class="panel-head"><h2 id="new-heading">Create incident</h2></div>
      <div class="body">
        <form id="create-form">
          <div class="group"><label for="service">Affected service</label>
            <select class="field" id="service" required>
              <option value="website">Pico Website</option>
              <option value="mcp">Pico MCP</option>
              <option value="oauth">Pico OAuth</option>
            </select>
          </div>
          <div class="group"><label for="title">Incident title</label>
            <input class="field" type="text" id="title" minlength="5" maxlength="120" required placeholder="Pico MCP connection errors">
          </div>
          <div class="group"><label for="create-message">First public update</label>
            <textarea class="field" id="create-message" minlength="10" maxlength="650" required placeholder="We're investigating connection failures affecting Pico MCP."></textarea>
          </div>
          <button id="create-incident" class="primary" type="submit">Create incident</button>
          <p class="notice" id="create-result" role="status"></p>
        </form>
      </div>
    </section>
  </div>
</main>
<footer><div class="wrap"><a href="https://picompiler.pages.dev/app/ai-usage">© 2026 Pico Development Team. All rights reserved.</a></div></footer>
<script src="/admin/admin.js" defer></script>
</body>
</html>
